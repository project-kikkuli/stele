# Generated by `stele compile` — the unbypassable terminus.
# Fails loud on findings AND on "couldn't measure" (exit 3): a crashed
# checker must never masquerade as compliance.
name: stele
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  stele:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install stele
        run: cargo install --path . --locked
      - name: stele check
        run: stele check

[package]
name = "stele"
version = "0.1.0"
edition = "2021"
description = "Declare a rule once; enforce it across every AI coding agent harness."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
globset = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

[package]
name = "stele"
version = "0.1.0"
edition = "2021"
description = "Declare a rule once; enforce it across every AI coding agent harness."
license = "MIT"
repository = "https://github.com/project-kikkuli/stele"
homepage = "https://github.com/project-kikkuli/stele"
documentation = "https://github.com/project-kikkuli/stele"
readme = "README.md"
keywords = ["ai", "agent", "hooks", "policy", "governance"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
globset = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
